[project]
name = "extract-repo-skills"
version = "0.1.0"
description = "Evidence-linked mapping of repository contributions to a versioned skill catalog"
readme = "README.md"
authors = [
    { name = "Lucas Telles", email = "lucas.telles@inf.ufrgs.br" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
]

[project.scripts]
extract-repo-skills = "extract_repo_skills:main"

[project.optional-dependencies]
llm = [
    "openai>=3.22.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
