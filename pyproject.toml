[project]
name = "extract-repo-skills"
version = "0.1.0"
description = "Evidence-linked mapping of repository contributions to a versioned skill catalog"
readme = "README.md"
authors = [
    { name = "Lucas Telles", email = "lucas.telles@inf.ufrgs.br" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
    "pygit2>=1.20.1,<2",
    "pygments>=2.19,<3",
]

[project.scripts]
extract-repo-skills = "extract_repo_skills:main"

[project.optional-dependencies]
llm = [
    "openai>=3.22.1",
]
api = [
    "fastapi>=0.119,<1",
    "uvicorn>=0.37,<1",
]
dev = [
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
